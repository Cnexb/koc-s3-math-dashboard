<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S3 Mathematics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <style>
    :root {
      --bg: #050816;
      --surface: rgba(18, 22, 48, 0.72);
      --surface-2: rgba(28, 34, 72, 0.85);
      --text: #eef2ff;
      --muted: #a8b4d8;
      --line: rgba(140, 160, 255, 0.22);
      --accent: #9ecbff;
      --glow: #c4b5fd;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: "Hanken Grotesk", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 85% 55% at 18% 10%, rgba(100, 80, 180, 0.28), transparent 58%),
        radial-gradient(ellipse 70% 45% at 88% 18%, rgba(55, 100, 190, 0.22), transparent 55%),
        radial-gradient(ellipse 75% 50% at 50% 100%, rgba(40, 65, 140, 0.32), transparent 58%),
        linear-gradient(180deg, #0a1022 0%, #0e1630 42%, #0b1224 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .stars, .stars2, .stars3 {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .stars {
      background-image:
        radial-gradient(2px 2px at 4% 8%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 9% 22%, #fff, transparent),
        radial-gradient(2px 2px at 14% 41%, #e8edff, transparent),
        radial-gradient(1.5px 1.5px at 18% 63%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 23% 12%, #d4dcff, transparent),
        radial-gradient(2px 2px at 27% 78%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 31% 34%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 36% 55%, #e8edff, transparent),
        radial-gradient(2px 2px at 41% 19%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 45% 72%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 49% 8%, #d4dcff, transparent),
        radial-gradient(2px 2px at 54% 46%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 58% 88%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 63% 27%, #e8edff, transparent),
        radial-gradient(2px 2px at 67% 61%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 72% 15%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 76% 49%, #d4dcff, transparent),
        radial-gradient(2px 2px at 81% 82%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 85% 33%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 90% 67%, #e8edff, transparent),
        radial-gradient(2px 2px at 94% 11%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 97% 54%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 7% 91%, #d4dcff, transparent),
        radial-gradient(2px 2px at 52% 96%, #fff, transparent);
      animation: twinkle 5s ease-in-out infinite alternate;
    }

    .stars2 {
      background-image:
        radial-gradient(1.5px 1.5px at 6% 38%, rgba(255,255,255,.95), transparent),
        radial-gradient(1.5px 1.5px at 12% 58%, rgba(255,255,255,.85), transparent),
        radial-gradient(1.5px 1.5px at 17% 84%, rgba(255,255,255,.9), transparent),
        radial-gradient(1.5px 1.5px at 25% 6%, rgba(255,255,255,.8), transparent),
        radial-gradient(1.5px 1.5px at 29% 48%, rgba(255,255,255,.9), transparent),
        radial-gradient(1.5px 1.5px at 34% 70%, rgba(255,255,255,.85), transparent),
        radial-gradient(1.5px 1.5px at 39% 28%, rgba(255,255,255,.9), transparent),
        radial-gradient(1.5px 1.5px at 44% 92%, rgba(255,255,255,.8), transparent),
        radial-gradient(1.5px 1.5px at 50% 36%, rgba(255,255,255,.9), transparent),
        radial-gradient(1.5px 1.5px at 56% 14%, rgba(255,255,255,.85), transparent),
        radial-gradient(1.5px 1.5px at 61% 74%, rgba(255,255,255,.9), transparent),
        radial-gradient(1.5px 1.5px at 66% 42%, rgba(255,255,255,.8), transparent),
        radial-gradient(1.5px 1.5px at 71% 96%, rgba(255,255,255,.85), transparent),
        radial-gradient(1.5px 1.5px at 78% 22%, rgba(255,255,255,.85), transparent),
        radial-gradient(1.5px 1.5px at 83% 58%, rgba(255,255,255,.9), transparent),
        radial-gradient(1.5px 1.5px at 88% 86%, rgba(255,255,255,.8), transparent),
        radial-gradient(1.5px 1.5px at 93% 40%, rgba(255,255,255,.9), transparent),
        radial-gradient(1.5px 1.5px at 98% 18%, rgba(255,255,255,.85), transparent);
      animation: twinkle 7s ease-in-out infinite alternate-reverse;
    }

    .stars3 {
      opacity: .9;
      background-image:
        radial-gradient(2.5px 2.5px at 20% 30%, rgba(220, 210, 255, 1), transparent),
        radial-gradient(2.5px 2.5px at 47% 58%, rgba(180, 210, 255, 1), transparent),
        radial-gradient(2px 2px at 73% 24%, #fff, transparent),
        radial-gradient(2.5px 2.5px at 33% 62%, rgba(220, 210, 255, .95), transparent),
        radial-gradient(2px 2px at 11% 74%, rgba(180, 210, 255, 1), transparent),
        radial-gradient(2.5px 2.5px at 86% 48%, #fff, transparent);
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: .55; }
      to { opacity: 1; }
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 34px 28px 56px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--glow);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 34px);
      letter-spacing: -.03em;
      text-shadow: 0 0 28px rgba(158, 203, 255, .25);
    }

    .intro {
      max-width: 520px;
      margin: 8px 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    button.card,
    a.card {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      backdrop-filter: blur(10px);
      color: inherit;
      font: inherit;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    button.card:hover,
    a.card:hover {
      transform: translateY(-2px);
      border-color: rgba(196, 181, 253, .55);
      box-shadow: 0 0 0 1px rgba(158, 203, 255, .15), 0 12px 28px rgba(0, 0, 0, .4);
    }

    button.card:focus-visible,
    a.card:focus-visible,
    .back:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .cover {
      height: 72px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 40%, rgba(158, 203, 255, .2), transparent 55%),
        linear-gradient(135deg, rgba(40, 50, 110, .9), rgba(20, 25, 55, .95));
    }

    .cover .katex {
      font-size: 1.55em;
      color: inherit;
      text-shadow: 0 0 16px rgba(158, 203, 255, .35);
    }

    .s3-mark {
      color: var(--accent);
      font-size: 34px;
      font-weight: 700;
      text-shadow: 0 0 18px rgba(158, 203, 255, .55);
    }

    .body {
      padding: 12px 14px 14px;
    }

    .body h2 {
      margin: 0 0 4px;
      font-size: 16px;
      line-height: 1.25;
    }

    .body p {
      margin: 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.4;
    }

    .tag {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .view { display: none; }
    .view.active { display: block; }

    .back {
      margin: 0 0 18px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .back:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .lesson .cover {
      height: 64px;
    }

    .lesson.indices .cover {
      color: var(--accent);
      background:
        radial-gradient(circle at 70% 30%, rgba(158, 203, 255, .25), transparent 50%),
        linear-gradient(135deg, rgba(30, 50, 120, .95), rgba(15, 20, 45, .98));
    }

    .lesson.polynomials .cover {
      color: #fde68a;
      background:
        radial-gradient(circle at 25% 60%, rgba(253, 230, 138, .18), transparent 50%),
        linear-gradient(135deg, rgba(55, 40, 100, .95), rgba(20, 25, 50, .98));
    }

    .lesson.polynomials .cover .katex {
      font-size: 1.2em;
      text-shadow: 0 0 14px rgba(253, 230, 138, .3);
    }

    .topic-panel {
      margin-top: 8px;
      padding: 22px 22px 26px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 40px rgba(88, 70, 180, .12);
    }

    .topic-panel .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .topic-panel h1 {
      margin-bottom: 8px;
    }

    .topic-panel p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      max-width: 520px;
    }

    .topic-panel .katex {
      color: var(--accent);
    }

    @media (max-width: 600px) {
      .page { padding: 24px 16px 40px; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="stars2" aria-hidden="true"></div>
  <div class="stars3" aria-hidden="true"></div>

  <main class="page">
    <section class="view active" id="home">
      <p class="eyebrow">Mathematics Gallery</p>
      <h1>Course Levels</h1>
      <p class="intro">Choose a level to view its lessons.</p>

      <div class="grid">
        <button class="card" type="button" data-go="lessons">
          <div class="cover"><span class="s3-mark">S3</span></div>
          <div class="body">
            <h2>S3</h2>
            <p>Indices · Factorization &amp; Polynomials</p>
            <span class="tag">JM24–JM25</span>
          </div>
        </button>
      </div>
    </section>

    <section class="view" id="lessons">
      <button class="back" type="button" data-go="home">← All levels</button>
      <p class="eyebrow">S3 Mathematics</p>
      <h1>S3 Lessons</h1>

      <div class="grid">
        <a class="card lesson indices" href="topics/law_of_indices/index.html">
          <div class="cover">\( a^{x} \)</div>
          <div class="body">
            <h2>Law of Indices</h2>
            <p>JM24 · Lesson 24</p>
            <span class="tag">JM24</span>
          </div>
        </a>

        <a class="card lesson polynomials" href="topics/factorization_polynomials/index.html">
          <div class="cover">\( (x+a)(x+b) \)</div>
          <div class="body">
            <h2>More about Factorization and Polynomials</h2>
            <p>JM25 · Lesson 25</p>
            <span class="tag">JM25</span>
          </div>
        </a>
      </div>
    </section>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        { left: '\\(', right: '\\)', display: false },
        { left: '\\[', right: '\\]', display: true }
      ]
    });"></script>
  <script>
    const views = document.querySelectorAll(".view");

    function show(id) {
      views.forEach((v) => v.classList.toggle("active", v.id === id));
      const titles = {
        home: "S3 Mathematics",
        lessons: "S3 Lessons",
      };
      document.title = titles[id] || "S3 Mathematics";
    }

    document.querySelectorAll("[data-go]").forEach((el) => {
      el.addEventListener("click", () => show(el.dataset.go));
    });
    // Open lessons view if returning with #lessons
    if (location.hash === "#lessons") show("lessons");
  </script>
</body>
</html>
