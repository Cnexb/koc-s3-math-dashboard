<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factorization &amp; Polynomials — JM25</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <style>
    :root {
      --surface: #ffffff;
      --surface-2: #eef2f7;
      --text: #1e293b;
      --muted: #64748b;
      --line: rgba(30, 41, 59, 0.12);
      --accent: #0284c7;
      --glow: #0369a1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: "Hanken Grotesk", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 12% 0%, rgba(14, 165, 233, 0.12), transparent 55%),
        radial-gradient(ellipse 70% 45% at 90% 10%, rgba(56, 189, 248, 0.1), transparent 50%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(125, 211, 252, 0.14), transparent 55%),
        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      background-attachment: fixed;
      user-select: none;
    }
    .page {
      position: relative; z-index: 1; width: min(860px, 100%);
      margin: 0 auto; padding: 28px 22px 80px;
    }
    .back {
      display: inline-flex; margin-bottom: 18px; padding: 7px 12px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface-2); color: var(--text);
      text-decoration: none; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .back:hover { border-color: var(--accent); color: var(--accent); }
    .eyebrow {
      margin: 0 0 6px; color: var(--glow); font-size: 11px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
    }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 36px); letter-spacing: -.03em; }
    .lead { margin: 0 0 18px; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .back:focus-visible, .tab:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 3px;
    }
    .tabs {
      display: flex; gap: 6px; margin: 0 0 14px;
      border-bottom: 1px solid var(--line); padding-bottom: 0;
    }
    .tab {
      background: none; border: none; color: var(--muted);
      font: inherit; font-weight: 600; font-size: 15px;
      padding: 10px 16px; cursor: pointer;
      border-radius: 10px 10px 0 0;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--text);
      background: var(--surface);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    .mode-panel { display: block; }
    .mode-panel.hidden { display: none; }
  </style>
</head>
<body>


<main class="page">
    <a class="back" href="../../s3.html#lessons">← S3 Lessons</a>
    <p class="eyebrow">JM25 · Lesson 25</p>
    <h1>More about Factorization and Polynomials</h1>
    <p class="lead">Interactive tools and comics for factorization and polynomials.</p>

    <nav class="tabs" aria-label="Lesson sections">
      <button class="tab active" type="button" data-tab="tools">Interactive Tools</button>
      <button class="tab" type="button" data-tab="comics">Comics</button>
    </nav>

    <section id="panel-tools" class="mode-panel"></section>
    <section id="panel-comics" class="mode-panel hidden"></section>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script>
    function renderKatex(root) {
      if (!window.renderMathInElement) return;
      renderMathInElement(root || document.body, {
        delimiters: [
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true },
        ],
      });
    }

    function showTab(name) {
      document.querySelectorAll(".tab").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === name);
      });
      document.querySelectorAll(".mode-panel").forEach((panel) => {
        panel.classList.toggle("hidden", panel.id !== "panel-" + name);
      });
      history.replaceState(null, "", "#" + name);
    }

    document.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => showTab(btn.dataset.tab));
    });

    document.addEventListener("DOMContentLoaded", () => {
      const tick = () => {
        if (window.renderMathInElement) renderKatex(document.body);
        else setTimeout(tick, 40);
      };
      tick();
      const hash = (location.hash || "").replace("#", "");
      if (hash === "comics") showTab("comics");
      else showTab("tools");
    });
  </script>
</body>
</html>
