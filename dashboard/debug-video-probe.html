<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Debug: concept video probe</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    pre { background: #f4f4f4; padding: 12px; overflow: auto; font-size: 12px; }
    button { font-size: 16px; padding: 10px 16px; }
  </style>
</head>
<body>
  <h1>Concept video host probe</h1>
  <p>Compares GitHub Pages vs Cloudflare video responses (runtime evidence for missing animations).</p>
  <button id="run" type="button">Run probe</button>
  <pre id="out">Click Run probe…</pre>
  <script>
    // #region agent log
    const ENDPOINT = "http://127.0.0.1:7343/ingest/474a74ed-e86f-45eb-826b-6126cb6afa26";
    const SESSION = "f6bb99";
    function agentLog(hypothesisId, location, message, data) {
      fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Debug-Session-Id": SESSION },
        body: JSON.stringify({
          sessionId: SESSION,
          runId: new URLSearchParams(location.search).get("runId") || "browser-probe",
          hypothesisId,
          location,
          message,
          data,
          timestamp: Date.now()
        })
      }).catch(function () {});
    }
    // #endregion

    const SAMPLES = [
      "slides/factorization/perfect-square-sum/index_assets/9a2d41aae316db90dc0d2137c08869781cb9eec31726f0949672ec1388ecfeb8.mp4",
      "slides/factorization/cross-method-leading/index_assets/2c579223e79cf4cbff58dfb33b7f697b9d3e66bde6cc03595c9a840459ffe8bc.mp4",
      "slides/percentage/change-factor/index_assets/"
    ];

    const HOSTS = [
      { id: "GH", base: "https://unipluseducationact-ctrl.github.io/koc-s3-math-dashboard/dashboard/" },
      { id: "CF", base: "https://uni-s3-math.pages.dev/" }
    ];

    async function probeOne(host, rel) {
      if (rel.endsWith("/")) return null;
      const url = host.base + rel;
      try {
        const res = await fetch(url, { method: "GET", cache: "no-store", redirect: "follow" });
        const ctype = res.headers.get("content-type") || "";
        const buf = await res.arrayBuffer();
        const data = {
          host: host.id,
          url: url,
          finalUrl: res.url,
          redirected: res.redirected,
          httpCode: res.status,
          contentType: ctype,
          bodyBytes: buf.byteLength,
          looksLikeHtml: /text\/html/i.test(ctype),
          looksLikeVideo: /video\/mp4/i.test(ctype),
          corsOk: true
        };
        // #region agent log
        agentLog("A", "debug-video-probe.html:probeOne", "browser mp4 probe", Object.assign({ runIdHint: "check-runId-field" }, data));
        // #endregion
        return data;
      } catch (err) {
        const data = { host: host.id, url: url, error: String(err), corsOk: false };
        // #region agent log
        agentLog("C", "debug-video-probe.html:probeOne", "browser mp4 probe failed", data);
        // #endregion
        return data;
      }
    }

    async function discoverPercentageSample() {
      // Resolve a real percentage mp4 via GH listing is not available; try known concept deck HTML then parse.
      const deck = "https://uni-s3-math.pages.dev/slides/percentage/change-factor/index.html";
      try {
        const html = await (await fetch(deck, { cache: "no-store" })).text();
        const m = html.match(/data-background-video="([^"]+\.mp4)"/);
        // #region agent log
        agentLog("B", "debug-video-probe.html:discover", "CF concept deck HTML parse", {
          deckUrl: deck,
          foundVideoAttr: !!(m && m[1]),
          videoAttr: m && m[1],
          htmlBytes: html.length
        });
        // #endregion
        return m && m[1] ? ("slides/percentage/change-factor/" + m[1]) : null;
      } catch (err) {
        // #region agent log
        agentLog("B", "debug-video-probe.html:discover", "CF concept deck fetch failed", { error: String(err) });
        // #endregion
        return null;
      }
    }

    document.getElementById("run").onclick = async function () {
      const out = document.getElementById("out");
      out.textContent = "Running…";
      // #region agent log
      agentLog("D", "debug-video-probe.html:run", "probe start", {
        pageHost: location.host,
        href: location.href,
        elearningEmbedHint: "uni-education-elearning uses uni-s3-math.pages.dev"
      });
      // #endregion

      const rels = SAMPLES.filter(function (s) { return !s.endsWith("/"); });
      const pct = await discoverPercentageSample();
      if (pct) rels.push(pct);

      const results = [];
      for (const host of HOSTS) {
        for (const rel of rels) {
          results.push(await probeOne(host, rel));
        }
      }

      // iframe sandbox / embed hypothesis: check if e-learning origin would block — log only
      // #region agent log
      agentLog("E", "debug-video-probe.html:run", "embed context note", {
        hypothesis: "E",
        note: "If CF returns HTML for mp4, videos fail inside e-learning iframe even without sandbox issues"
      });
      // #endregion

      out.textContent = JSON.stringify(results, null, 2);
    };
  </script>
</body>
</html>
